cafe_url = "https://cafe.daum.net/730418"
cafe_grpid = "1R9cj"
login_url = "https://accounts.kakao.com/login/"
data_dir = "data"
poll_interval_seconds = 300
headless = true
locale = "ko-KR"
timezone_id = "Asia/Seoul"
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
allow_mobile_fallback = false

# Keep this directory outside the repo if you want to copy it between PC and Raspberry Pi.
user_data_dir = "browser-profile"

# Raspberry Pi 3B often works better with the system Chromium package.
# Example:
# browser_executable_path = "/usr/bin/chromium-browser"

scan_strategy = "direct_numbers" # direct_numbers or board_list
max_pages_per_board = 1
max_posts_per_board_page = 40 # used to detect the latest number from the list
direct_scan_min_post_id = 1
direct_scan_limit_per_board = 0 # 0 scans every number from latest down to direct_scan_min_post_id
rescan_existing_posts = false
image_timeout_seconds = 20
duplicate_hamming_threshold = 8
blacklist_score_threshold = 90

[login]
# Optional. If both values are set, scan/login will automatically sign in again
# when Daum/Kakao sends the browser to a login page.
username = ""
password = ""
username_selector = "input[name='loginId'], input[name='email'], input[type='email'], input[name='username'], input#loginId"
password_selector = "input[name='password'], input[type='password']"
submit_selector = "button[type='submit'], input[type='submit'], button:has-text('로그인'), a:has-text('로그인')"

[[boards]]
name = "중고장터 C3Zg"
url = "https://cafe.daum.net/730418/C3Zg"

[[boards]]
name = "중고장터 C3Zi"
url = "https://cafe.daum.net/730418/C3Zi"

[[boards]]
name = "중고장터 TyYz"
url = "https://cafe.daum.net/730418/TyYz"

[[boards]]
name = "중고장터 KykD"
url = "https://cafe.daum.net/730418/KykD"

[comment]
enabled = false
mode = "dry_run" # dry_run or post
min_score = 80
max_per_run = 2
template = """
자동 탐지 알림: 이 글의 이미지 {duplicate_image_count}장이 과거 게시글 {duplicate_post_count}개와 유사합니다.
위험도 추정: {score}%.
참고 원글: {source_links}
사기 확정이 아닌 이미지 재사용 주의 신호입니다.
"""

[selectors]
# Daum Cafe 화면이 바뀌면 여기만 조정할 수 있습니다.
post_link_contains = []
comment_textarea = "textarea, [contenteditable='true']"
comment_submit = "button:has-text('등록'), button:has-text('댓글'), input[type='submit']"
